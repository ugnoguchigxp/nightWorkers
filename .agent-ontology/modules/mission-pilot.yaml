{
  "version": 1,
  "id": "mission-pilot",
  "label": "Mission Pilot",
  "summary": "Owns the Mission Control layer that reads Mission Planner task proposals, binds human approvals to deterministic snapshots, and connects approved work to execution evidence without becoming a Worker or Queue replacement.",
  "ubiquitousLanguage": [
    {
      "name": "MissionPilotTaskCandidate",
      "meaning": "A mission_task_proposals row adapted into the Mission Pilot TaskCandidate contract; goal-generated mission_task_candidates are not included."
    },
    {
      "name": "MissionApproval",
      "meaning": "A human decision bound to a canonical target snapshot and SHA-256 hash."
    },
    {
      "name": "MissionEvidenceRef",
      "meaning": "A typed reference to existing Queue, Run, Review, Verification, artifact, diff, or command evidence."
    }
  ],
  "responsibilities": [
    "Adapt Mission Planner task proposals into the Mission Pilot TaskCandidate contract.",
    "Generate deterministic approval snapshots and hashes.",
    "Define typed Mission evidence references.",
    "Orchestrate approval, MissionTask, Queue, Autopilot, evaluation, and replan phases without bypassing existing subsystem guards."
  ],
  "ownedPaths": [
    "api/modules/mission-pilot/**",
    "shared/schemas/mission-pilot.schema.ts",
    "tests/mission-pilot-*.test.ts",
    "spec/docs/mission-pilot-mvp-remaining-work.md"
  ],
  "readMostlyPaths": [
    "api/modules/mission-planner/**",
    "api/modules/project-detail/**",
    "api/modules/project-evaluation/**",
    "api/modules/queue/**",
    "api/db/mission-planner-schema.ts",
    "api/db/project-detail-schema.ts",
    "shared/schemas/mission-planner.schema.ts",
    "shared/schemas/project-detail.schema.ts",
    "src/modules/nightworkers/components/project-detail/**"
  ],
  "ownedData": {
    "tables": [],
    "files": []
  },
  "invariants": [
    {
      "id": "pilot-candidate-is-proposal",
      "statement": "Mission Pilot TaskCandidate means mission_task_proposals only; mission_task_candidates remains a Project Detail goal-generation concept.",
      "check": "Mission Pilot baseline tests cover both sources and reject the goal-generation source from the Pilot schema."
    },
    {
      "id": "approval-snapshot-deterministic",
      "statement": "The same approval-relevant TaskCandidate content produces the same canonical snapshot hash, while meaningful ordered-field changes produce a different hash.",
      "check": "Mission Pilot baseline tests cover stable SHA-256 output and array-order sensitivity."
    },
    {
      "id": "phase-zero-no-runtime-mutation",
      "statement": "Phase 0 adds contracts and characterization only; it does not change DB, API, Queue, or UI runtime behavior.",
      "check": "Mission Planner, Project Detail, and legacy Queue approval focused tests remain green."
    }
  ],
  "allowedMutations": [
    "Mission Pilot shared schemas",
    "Mission Pilot pure adapters and snapshot helpers",
    "Mission Pilot characterization and focused tests",
    "Mission Pilot implementation plan"
  ],
  "forbiddenMutations": [
    "Mission Planner decomposition ownership",
    "Project Detail goal-generation candidate ownership",
    "Queue admission bypass",
    "worker execution behavior",
    "provider routing policy"
  ],
  "allowedCrossModule": [
    {
      "module": "mission-planner",
      "paths": [
        "api/modules/mission-planner/**",
        "api/db/mission-planner-schema.ts",
        "shared/schemas/mission-planner.schema.ts",
        "tests/mission-planner.test.ts"
      ],
      "reason": "Mission Pilot reads Mission Planner task proposal and lifecycle contracts without taking ownership of decomposition."
    },
    {
      "module": "project-detail",
      "paths": [
        "api/modules/project-detail/**",
        "api/db/project-detail-schema.ts",
        "shared/schemas/project-detail.schema.ts",
        "src/modules/nightworkers/components/project-detail/**",
        "tests/project-detail-backend.test.ts"
      ],
      "reason": "Mission Pilot must characterize the existing dual TaskCandidate display without changing Project Detail ownership."
    }
  ],
  "verification": {
    "baseline": [
      {
        "command": "bun run test run tests/mission-planner.test.ts tests/project-detail-backend.test.ts",
        "expect": "Existing Mission Planner and Project Detail behavior passes before Mission Pilot edits."
      }
    ],
    "focused": [
      {
        "command": "bun run test run tests/mission-pilot-baseline.test.ts tests/mission-planner.test.ts tests/project-detail-backend.test.ts",
        "expect": "Mission Pilot Phase 0 contracts and existing subsystem behavior pass together."
      }
    ],
    "full": [
      {
        "command": "bun run verify",
        "expect": "Repository verification passes."
      }
    ]
  },
  "completionReport": {
    "require": ["primaryModule", "boundaryCrossings", "invariantsChecked", "verification"]
  }
}
