  "allowedMutations": ["provider transport", "structured response extraction", "usage mapping"],
  "forbiddenMutations": ["Supervisor workflow policy", "user-text keyword routing", "Task Run state policy"],
  "allowedCrossModule": [],
  "verification": { "baseline": [{ "command": "bun run test:supervisor-regression", "expect": "Structured LLM regression passes." }], "focused": [{ "command": "bun run test:supervisor-regression", "expect": "Provider and Supervisor contracts pass." }], "full": [{ "command": "bun run verify", "expect": "Repository verification passes." }] },
  "completionReport": { "require": ["primaryModule", "boundaryCrossings", "invariantsChecked", "verification"] }
