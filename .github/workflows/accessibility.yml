name: Accessibility

on:
  workflow_call:
  # pull_request:
  # push:
  #   branches: [main]

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    name: Axe and keyboard accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Run required accessibility gate
        run: node scripts/verify.mjs accessibility
      - name: Record release check evidence
        run: >-
          node scripts/release/release-check-evidence.mjs
          --id accessibility
          --output artifacts/release-check-accessibility.json
      - name: Upload release check evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-check-accessibility
          path: artifacts/release-check-accessibility.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload accessibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
