name: Verified Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-core:
    name: Verify and package macOS ARM64
    runs-on: macos-14
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - name: Install and checksum pinned Node sidecar runtime
        run: node scripts/desktop/install-node-runtime.mjs
      - name: Rebuild native modules for pinned Node runtime
        run: bun run desktop:rebuild-native
      - run: bunx playwright install chromium
      - name: Check tag and release metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: bun run release:check -- --tag "$GITHUB_REF_NAME"
      - name: Capture desktop preflight
        run: node scripts/desktop/collect-diagnostics.mjs preflight --expected-target darwin:arm64
      - name: Run the unified release gate
        run: |
          mkdir -p artifacts
          set -o pipefail
          NIGHTWORKERS_RELEASE=1 bun run verify:release 2>&1 | tee artifacts/verify-release.log
      - name: Package verified desktop artifact
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_NOTARYTOOL_PROFILE: ${{ secrets.APPLE_NOTARYTOOL_PROFILE }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          bun run desktop:build:release
          NIGHTWORKERS_DESKTOP_APP_PATH="$GITHUB_WORKSPACE/src-tauri/target/release/bundle/macos/NightWorkers.app" \
            NIGHTWORKERS_RELEASE=1 bun run desktop:sign
          bun run desktop:bundle-budget
          bun run desktop:third-party-notices
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/release/bundle/macos/NightWorkers.app \
            "NightWorkers-${VERSION}-macos-arm64.zip"
      - name: Record release check evidence
        run: |
          for CHECK_ID in base audit e2e desktop-check package; do
            node scripts/release/release-check-evidence.mjs \
              --id "$CHECK_ID" \
              --output "artifacts/release-check-${CHECK_ID}.json"
          done
      - name: Upload release-core check evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-check-core
          path: artifacts/release-check-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightworkers-candidate-macos-arm64
          path: NightWorkers-*-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Capture desktop postmortem
        if: always()
        run: node scripts/desktop/collect-diagnostics.mjs postmortem --expected-target darwin:arm64
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-desktop-diagnostics
          path: artifacts/**
          if-no-files-found: error
          retention-days: 14

  accessibility:
    needs: release-core
    uses: ./.github/workflows/accessibility.yml

  desktop-matrix:
    needs: release-core
    uses: ./.github/workflows/desktop-matrix.yml

  attest:
    name: Attest one source SHA
    needs: [release-core, accessibility, desktop-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Download required check evidence
        uses: actions/download-artifact@v8
        with:
          pattern: release-check-*
          path: release-checks
          merge-multiple: true
      - name: Download candidate artifact
        uses: actions/download-artifact@v8
        with:
          name: nightworkers-candidate-macos-arm64
          path: release-output
      - name: Create release attestation and artifact manifest
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ARTIFACT="release-output/NightWorkers-${VERSION}-macos-arm64.zip"
          ATTESTATION="release-output/release-attestation-${VERSION}.json"
          MANIFEST="release-output/release-artifacts-${VERSION}.json"
          node scripts/release/release-attestation.mjs \
            --artifact "$ARTIFACT" \
            --checks release-checks \
            --output "$ATTESTATION" \
            --target darwin:arm64
          bun run release:manifest -- \
            --artifact "$ARTIFACT" \
            --attestation "$ATTESTATION" \
            --output "$MANIFEST" \
            --signing verified \
            --notarization verified
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: release-output/nightworkers-sbom.cdx.json
      - name: Upload attested release bundle
        uses: actions/upload-artifact@v7
        with:
          name: nightworkers-attested-${{ github.sha }}
          path: release-output/**
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish attested artifact without rebuild
    if: startsWith(github.ref, 'refs/tags/')
    needs: attest
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Download attested release bundle
        uses: actions/download-artifact@v8
        with:
          name: nightworkers-attested-${{ github.sha }}
          path: release-output
      - name: Resolve release notes
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "RELEASE_NOTES_PATH=spec/release-notes/${VERSION}.md" >> "$GITHUB_ENV"
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          files: |
            release-output/NightWorkers-*-macos-arm64.zip
            release-output/release-artifacts-*.json
            release-output/release-attestation-*.json
            release-output/nightworkers-sbom.cdx.json
