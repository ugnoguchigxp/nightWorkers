name: Verified Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verified-macos-artifact:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - name: Check tag and release metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: bun run release:check -- --tag "$GITHUB_REF_NAME"
      - name: Run the unified release gate
        run: bun run verify:release
      - name: Package verified desktop artifact
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "RELEASE_NOTES_PATH=spec/release-notes/${VERSION}.md" >> "$GITHUB_ENV"
          ditto -c -k --sequesterRsrc --keepParent \
            src-tauri/target/release/bundle/macos/NightWorkers.app \
            "NightWorkers-${VERSION}-macos-arm64.zip"
          bun run release:manifest -- \
            --artifact "NightWorkers-${VERSION}-macos-arm64.zip" \
            --output "release-artifacts-${VERSION}.json" \
            --verification-status passed \
            --signing not_requested \
            --notarization not_requested
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: nightworkers-sbom.cdx.json
      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightworkers-${{ github.ref_name }}-macos-arm64
          path: |
            NightWorkers-*-macos-arm64.zip
            release-artifacts-*.json
            nightworkers-sbom.cdx.json
      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          files: |
            NightWorkers-*-macos-arm64.zip
            release-artifacts-*.json
            nightworkers-sbom.cdx.json
