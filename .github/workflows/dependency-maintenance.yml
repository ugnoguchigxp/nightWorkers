name: Dependency Maintenance

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  weekly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Audit High and Critical advisories
        id: audit
        continue-on-error: true
        env:
          NIGHTWORKERS_AUDIT_REPORT: ${{ github.workspace }}/artifacts/dependency-audit.json
        run: |
          mkdir -p artifacts
          bun run verify:audit
      - name: Open or refresh advisory issue
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Dependency audit requires attention";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "dependencies,security",
            });
            const body = [
              "The scheduled High/Critical dependency audit failed.",
              "",
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "Review the uploaded report, update the dependency, or add a time-bounded reviewed exception.",
            ].join("\n");
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["dependencies", "security"],
              });
            }
      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-dependency-audit
          path: artifacts/dependency-audit.json
          if-no-files-found: warn
          retention-days: 30
      - name: Fail after evidence and notification
        if: steps.audit.outcome == 'failure'
        run: exit 1
