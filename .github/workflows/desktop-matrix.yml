name: Desktop matrix

on:
  workflow_call:
  # pull_request:
  #   paths:
  #     - ".github/workflows/desktop-matrix.yml"
  #     - "api/**"
  #     - "src/**"
  #     - "src-tauri/**"
  #     - "scripts/desktop/**"
  #     - "package.json"
  #     - "bun.lock"
  # push:
  #   branches: [main]
  # workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: desktop-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-14
            target: darwin:arm64
            check_id: desktop-macos
            packaged_smoke: true
          - platform: linux
            os: ubuntu-24.04
            target: linux:x64
            check_id: desktop-linux
            packaged_smoke: false
          - platform: windows
            os: windows-latest
            target: win32:x64
            check_id: desktop-windows
            packaged_smoke: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install and checksum pinned Node sidecar runtime
        run: node scripts/desktop/install-node-runtime.mjs
      - name: Rebuild native modules for pinned Node runtime
        run: bun run desktop:rebuild-native
      - name: Capture desktop preflight
        run: node scripts/desktop/collect-diagnostics.mjs preflight --expected-target ${{ matrix.target }}
      - name: Verify platform configuration
        run: bun run desktop:check:cross-platform
      - name: Build frontend staging input
        run: bun run build:frontend
      - name: Prepare sidecar
        run: bun run desktop:prepare-sidecar
      - name: Generate bundled third-party notices
        run: bun run desktop:third-party-notices
      - name: Verify target manifest
        run: node scripts/desktop/verify-target-manifest.mjs ${{ matrix.target }}
      - name: Sidecar readiness smoke
        run: bun run desktop:smoke-sidecar
      - name: Build macOS package
        if: runner.os == 'macOS'
        run: bun run desktop:build:dmg
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: bun run desktop:build:linux
      - name: Build Windows installers
        if: runner.os == 'Windows'
        run: bun run desktop:build:windows
      - name: Packaged app smoke
        if: matrix.packaged_smoke
        run: bun run desktop:smoke
      - name: Linux native install and launch smoke
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run desktop:smoke-native-package -- linux
      - name: Windows native install and launch smoke
        if: runner.os == 'Windows'
        run: bun run desktop:smoke-native-package -- windows
      - name: Verify bundle budget
        run: bun run desktop:bundle-budget
      - name: Record release check evidence
        run: >-
          node scripts/release/release-check-evidence.mjs
          --id ${{ matrix.check_id }}
          --output artifacts/release-check-${{ matrix.check_id }}.json
      - name: Upload release check evidence
        uses: actions/upload-artifact@v7
        with:
          name: release-check-${{ matrix.check_id }}
          path: artifacts/release-check-${{ matrix.check_id }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Capture desktop postmortem
        if: always()
        run: node scripts/desktop/collect-diagnostics.mjs postmortem --expected-target ${{ matrix.target }}
      - name: Upload diagnostics and packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            artifacts/**
            scripts/desktop/staged/manifest.json
            src-tauri/target/release/bundle/**
            *.log
