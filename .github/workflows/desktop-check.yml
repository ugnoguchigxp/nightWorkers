name: Desktop Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-check:
    name: macOS desktop verification
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: desktop-${{ runner.os }}-${{ hashFiles('bun.lock', 'src-tauri/Cargo.lock') }}
          restore-keys: desktop-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Capture desktop preflight
        run: node scripts/desktop/collect-diagnostics.mjs preflight --expected-target darwin:arm64
      - name: Run desktop verification
        run: |
          mkdir -p artifacts
          set -o pipefail
          bun run verify:desktop 2>&1 | tee artifacts/verify-desktop.log
      - name: Capture desktop postmortem
        if: always()
        run: node scripts/desktop/collect-diagnostics.mjs postmortem --expected-target darwin:arm64
      - name: Upload desktop verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-verification-log
          if-no-files-found: error
          path: artifacts/**
          retention-days: 7
