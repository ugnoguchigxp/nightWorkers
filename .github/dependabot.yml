version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "01:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    groups:
      runtime-patch-minor:
        dependency-type: production
        update-types: [patch, minor]
      development-patch-minor:
        dependency-type: development
        update-types: [patch, minor]
    commit-message:
      prefix: deps
    labels: [dependencies]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "01:30"
      timezone: Asia/Tokyo
    groups:
      tauri-rust-patch-minor:
        update-types: [patch, minor]
    commit-message:
      prefix: deps-rust
    labels: [dependencies, rust]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: deps-actions
    labels: [dependencies, github-actions]
