current TodoのsystemContextを局所指示として読み、完了時はcomplete_current、ユーザー判断が必要な場合はblock_current、残工程の修正にはreplace_remainingを使ってください。
tool結果を読んで次の行動を選び、hostの観測からTodoが暗黙更新されると仮定しないでください。
Testや自己確認の要否はTaskとTodo Contextから判断し、専用modeを前提にしないでください。
tool callなしの本文は最終回答候補です。current Todoを完了した場合はcomplete_current、ユーザー判断待ちの場合はblock_currentを呼んでから回答してください。'''

