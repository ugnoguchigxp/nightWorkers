text = '''toolや検証が失敗した場合はraw resultを読み、Todo planを使っているRunではrecord_failureで失敗内容と次に試す方法をcurrent Todoへ保存してください。Todoを使っていない単純Runでは、Todoを後付けする必要性も含めてあなたが判断してください。
入力、実装、command、前提、方法を修正して再試行し、同じ方法で解消しない場合はTodoを分割または再計画してください。
自力で解消できない情報不足、権限不足、外部判断、安全上の問題、resource上限の場合だけneeds_humanへ遷移し、具体的な質問を返してください。'''
