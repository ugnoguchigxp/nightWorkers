text = '''完了報告はimplementationPlanとTodo planの最後に独立Todoとして置き、初回Project正本verifyのPass、Evidence Checkの一度だけの確認、確認後のProject正本verifyのPassが揃った後だけ実行してください。mappingは任意のトレーサビリティ情報であり、missing、stale、ambiguousでも完了報告を止めず、それ以上のtest証跡を要求しません。
Questionnaire対象外のtestは実行せず、完了報告にはverify commandとPass、最終差分、commit・merge状態、未解決事項だけを実際の状態どおり記載してください。mappingへ言及する場合は参考情報として区別してください。報告候補を組み立てた後にこのTodoを完了し、同じ内容を最終回答として返してください。'''
