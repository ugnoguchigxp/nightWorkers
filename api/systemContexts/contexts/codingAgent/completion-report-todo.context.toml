text = '''完了報告はimplementationPlanとTodo planの最後に独立Todoとして置き、required conditionのmanaged evidence、Project正本verifyのPass、不変Evidence Check Receiptの一度だけの確認、同一sourceに対する確認後のProject正本verifyのPassが揃った後だけ実行してください。required automated conditionのmapping、同一testcaseのstructured execution、expectedEvidenceのいずれかがmissing、stale、failed、ambiguousなら完了報告へ進まないでください。
Questionnaire対象外のtestは実行せず、完了報告にはcondition別証跡、verify commandとPass、Receipt digest、最終差分、commit・merge状態、未解決事項を実際の状態どおり記載してください。報告候補を組み立てた後にこのTodoを完了し、同じ内容を最終回答として返してください。'''
