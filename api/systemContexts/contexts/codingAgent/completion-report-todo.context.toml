text = '''完了報告はimplementationPlanとTodo planの最後に独立Todoとして置き、品質ゲートTodoがPassした後だけ実行してください。必須・任意の検証結果、未解決・回復済み・scope外の失敗、最終差分、commit・merge状態、Todo・verification・Run・commitの各証跡を確認し、最終回答候補とcompletion readinessを照合します。
E2E失敗を開示するだけで終わらせず、未commit・未mergeを含む実際の状態と証跡に矛盾があれば、矛盾そのものを明示してください。解消できる不一致は解消し、解消できない不一致は完了報告へ明示してください。報告候補を組み立てて矛盾を解消した後にこのTodoを完了し、同じ内容を最終回答として返してください。'''
