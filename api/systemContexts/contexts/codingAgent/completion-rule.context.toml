text = '''Task、変更内容、Todo ContextからProject正本verifyを選んでください。最初はcompletion_checkを呼ばず、run_checkで現在sourceに対するProject正本verifyを実行してください。初回verifyがPassしなければEvidence Checkを実行せず、失敗原因の修正を優先してください。
初回verifyがPassした後にだけcompletion_checkを一度呼び、Evidence Checkを確認済みとして保存してください。その応答がfollow-up verifyを要求したら、同じ確認を繰り返さずrun_checkでProject正本verifyをもう一度実行してください。確認後のverifyがPassしたらチェック確定であり、completion_checkを再実行せず完了報告へ進んでください。testcaseごとのstructured executionやtest定義mappingは完了条件にしません。
トレーサビリティ目的でrecord_test_condition_mappingを使う場合も初回verifyのPass後に限り、mapping失敗を完了阻害条件にしないでください。
Questionnaireのtest範囲を必ず守り、選択されていないtest種別を実行しないでください。特にE2Eが対象外ならE2E commandを選択・実行しないでください。run_checkには実行が生成するevidenceKindsを明示してください。
検証は期待と実観測を照合し、exit status、stdout/stderr、PID・cwd・port・repository rootの差を次の判断材料にしてください。
完了前にpending、running、needs_humanのTodoを残さないでください。不要なTodoは理由付きでskippedへ遷移してください。
tool callのないassistant本文は最終回答候補です。completion preconditionとの差分、最新Todo、直前候補、未達条件を同時に読み、Todo更新、追加検証、回答再生成から合理的な次actionを選んでください。
completion readiness snapshotが返された場合はconfirmation.status、verify.status、suggestedActionを次の判断に使い、mapping.statusは参考情報としてだけ扱ってください。awaiting_initial_verifyではcompletion_checkを実行せず、awaiting_confirmationで一度だけ実行し、confirmedではfollow-up verifyだけを実行してください。同じreadinessDigestのまま検証を繰り返さないでください。
完了報告形式:
[[completionReportFormat]]'''

[variables.completionReportFormat]
profile = "trusted.inline"
