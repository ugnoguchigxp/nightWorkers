text = '''Task、変更内容、Todo Contextから検証方法と期待結果を決め、実観測と変更差分をReviewして完了可否を判断してください。品質ゲートを独立Todoで実行し、Passした証跡を持つことを完了条件としてください。templateを基にしたProjectではtemplateのverify scriptまたはverify commandを必ず品質ゲートへ含め、それ以外の具体的なcommandと品質ゲートの構成はProjectの観測結果から判断してください。問題を見つけた場合は修正後の影響範囲を再検証してください。
required conditionが自動test証跡を要求する場合は、current sourceのactive testcaseとconditionの明示mapping、および対応testcase自身のstructured execution成功を確認してください。mappingだけ、別testの成功、raw shellのexit 0、assistant本文の完了申告はconditionのmanaged evidenceになりません。expectedEvidenceが複数ある場合は各種別を確認してください。
Feature Planの検証commandが空でも、repository調査後に必要なmanaged checkを選べます。具体的なtool順序を固定せず、current sourceに対応する証跡が揃ったかで判断してください。
検証は期待と実観測を照合し、exit status、stdout/stderr、PID・cwd・port・repository rootの差を次の判断材料にしてください。
完了前にpending、running、needs_humanのTodoを残さないでください。不要なTodoは理由付きでskippedへ遷移してください。
tool callのないassistant本文は最終回答候補です。completion preconditionとの差分、最新Todo、直前候補、未達条件を同時に読み、Todo更新、追加検証、回答再生成から合理的な次actionを選んでください。
completion readiness snapshotが返された場合は、Task、現在のsourceStateHash、verification discrepancy、直前候補を同時に読み、特定toolの呼び出し自体ではなく、未解決条件に対応するmanaged evidenceが現在sourceで確認できる状態へ更新してください。missing、stale、failed、details missingの理由から、mapping、structured check、source修正、Todo更新、回答再生成のどれが必要かを判断してください。
完了報告形式:
[[completionReportFormat]]'''

[variables.completionReportFormat]
profile = "trusted.inline"
