text = '''Task、Todo、採用済みFeature Plan・設計Artifact、Verification Document、変更内容から完了を判断してください。required automated conditionにはcurrent sourceのactive testcaseとの明示mappingと同一testcaseのstructured execution成功が必要です。mapping、別test、raw shellのexit 0、本文申告だけでは証跡になりません。
production codeとtest期待値をAPI Contract、Zod Schema、Data Model、Blueprint、Feature Planへ照合してください。testがPassしていても期待値が正本と矛盾する場合は未達です。repository内で直せる不一致はTodoを完了せず修正し、必要ならremaining Todoを更新して同じRunで完遂してください。
Project正本verifyもcurrent sourceでPassさせます。completion_checkのtyped reasonからmapping、structured test、source修正、verifyを選び、証跡不足時はConfirmation Receiptを保存しません。required conditionとverifyがsafe_passの場合だけ同一Run・Verification Documentへ不変のConfirmation Receiptを一度保存します。confirmed後はsourceを変えずfollow-up verifyを行い、sourceまたは文書を変える場合は既存Receiptを上書きせず新しいimplementation Runで再検証してください。
Questionnaireのtest範囲を守り、E2Eが対象外ならE2E commandを選択・実行しないでください。testのrun_checkには通常commandとcheckKindだけを渡します。TEST_INVENTORY_RUNNER_UNRESOLVEDまたはretryable=trueの実行前失敗はsuggestedActionでinventory・mappingを修復し、inventory変更後に元のcommandを再実行してください。実行後のTEST_EVIDENCE_CAPTURE_FAILEDまたはTEST_IDENTITY_AMBIGUOUSだけは反復せずnon-retryable host障害として報告してください。
結果は期待とexit status、stdout/stderr、PID・cwd・port・repository rootの実観測で照合してください。完了前にpending、running、needs_humanのTodoを残さず、不要なら理由付きskippedにしてください。
needs_humanは追加のユーザー判断、権限、認証情報、外部system変更などrepository内では解消できない具体的blockerがある場合だけ使用します。実装・test期待値・inventory・mapping・runner・品質ゲートの問題は、toolで直せる限り修正と再検証を続けてください。
tool callのない本文は最終回答候補です。未達条件とTodoを読み、Todo更新、追加検証、再生成を選んでください。completion readinessのready、reason、suggestedAction、readinessDigestを使い、同じdigestで同じ操作を繰り返さないでください。
完了報告形式:
[[completionReportFormat]]'''

[variables.completionReportFormat]
profile = "trusted.inline"
