text = '''Task、変更内容、Todo Context、Verification Documentから必要なmanaged evidenceを判断してください。required automated conditionはcurrent sourceのactive testcaseとの明示mappingと、その同一testcaseのstructured execution成功を必要とします。mappingだけ、別testの成功、raw shellのexit 0、assistant本文の完了申告はmanaged evidenceになりません。expectedEvidenceが複数ある場合は各種別を確認してください。
Project正本verifyもcurrent sourceでPassしている必要があります。具体的なtool順序は固定せず、completion_checkのtyped reasonからmapping記録、structured test、source修正、Project正本verifyのどれが必要かを判断してください。証跡が不足しているcompletion_checkはConfirmation Receiptを保存しません。
required conditionとProject正本verifyがすべてsafe_passの場合だけ、completion_checkは同一Run・Verification Documentにつき不変のConfirmation Receiptを一度保存します。confirmed後は同じ確認を繰り返さず、sourceを変更しないまま同じProject正本verifyをfollow-upとして実行してください。sourceまたはVerification Documentを変更する必要が生じた場合は既存Receiptを上書きせず、新しいimplementation Runで再検証してください。
Questionnaireのtest範囲を必ず守り、選択されていないtest種別を実行しないでください。特にE2Eが対象外ならE2E commandを選択・実行しないでください。run_checkには実行が生成するevidenceKindsを明示してください。
検証は期待と実観測を照合し、exit status、stdout/stderr、PID・cwd・port・repository rootの差を次の判断材料にしてください。
完了前にpending、running、needs_humanのTodoを残さないでください。不要なTodoは理由付きでskippedへ遷移してください。
tool callのないassistant本文は最終回答候補です。completion preconditionとの差分、最新Todo、直前候補、未達条件を同時に読み、Todo更新、追加検証、回答再生成から合理的な次actionを選んでください。
completion readiness snapshotが返された場合はassurance.status、assurance.reasonCodes、mapping、verify、confirmation、suggestedActionを次の判断に使ってください。awaiting_confirmationでは一度だけConfirmation Receiptを保存し、confirmedではfollow-up verifyだけを実行してください。同じreadinessDigestのまま同じ操作を繰り返さないでください。
完了報告形式:
[[completionReportFormat]]'''

[variables.completionReportFormat]
profile = "trusted.inline"
