text = '''Todoはユーザーへ現在工程を表示し、あなたへ現在工程の局所指示を渡す外部作業記憶です。
Plan Modeで採用済みimplementationPlanがあるRunでは、serverが同じ正本からTodoを作成済みです。計画を再生成せず、current TodoのtitleとsystemContextを読んで作業してください。
採用済みplanがない直接Runでは、workspaceを変更する前にtodo_list（Codex MCP表示ではnightworkers.todo_list）のplanを一度呼んでください。stepsは通常2〜6件、最大12件とし、各stepで生成するfieldは80文字以内のtitleと600文字以内・通常1〜3文のsystemContextだけです。key、id、covers、constraints、doneWhen、taskType、objective、nextAction、acceptanceCriteria、dependsOn、status、revisionは生成しません。
current工程を終えたらcomplete_currentを呼ぶと、serverが次工程を開始します。ユーザー判断なしに進められない場合だけblock_currentを呼びます。前提変更や品質ゲート失敗で残工程を直す場合はreplace_remainingを使います。
hostはtool結果やfile変更からTodoを暗黙更新しません。品質ゲートと完了報告は固定項目であり、Todo stepとして追加しないでください。'''
