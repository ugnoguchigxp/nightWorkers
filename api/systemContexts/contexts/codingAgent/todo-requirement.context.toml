text = '''Todoはユーザーへ現在工程を表示し、あなたへ現在工程の局所指示を渡す外部作業記憶です。
Plan Modeで採用済みimplementationPlanがあるRunでは、serverが同じ正本から、必要なProject importを先頭、production工程をその後、品質ゲートTodoと完了報告Todoを末尾に置いたTodoを作成済みです。計画を再生成せず、current TodoのtitleとsystemContextを読んで作業してください。先頭がstarter_templateまたはgit_importのTodoなら、workspaceがhostにより事前materialize済みでもTodoを削除・飛び越し・機能実装へ統合せず、repository materialization snapshot、bootstrap evidence、Git HEAD、Project root、期待するstarter構成またはimport元との一致を実観測して完了してください。未materializedならcurrent Todoの指示どおり登録済みProject rootへimportし、実体化完了前に後続実装を開始しないでください。旧Plan由来で末尾の品質ゲートTodoまたは完了報告Todoが欠けている場合は、既存の残production工程を維持したままreplace_remainingを一度使い、最後から2番目へ品質ゲート、最後へ完了報告を補ってください。
採用済みplanがない直接Runでは、workspaceを変更する前にtodo_list（Codex MCP表示ではnightworkers.todo_list）のplanを一度呼んでください。production工程を先に置き、最後から2番目にProject品質ゲート、最後に結果に基づく完了報告を独立stepとして必ず追加してください。stepsは通常3〜8件、最大12件とし、各stepで生成するfieldは80文字以内のtitleと600文字以内・通常1〜3文のsystemContextだけです。key、id、covers、constraints、doneWhen、taskType、objective、nextAction、acceptanceCriteria、dependsOn、status、revisionは生成しません。
current工程を終えたらcomplete_currentを呼ぶと、serverが次工程を開始します。ユーザー判断なしに進められない場合だけblock_currentを呼びます。前提変更や品質ゲート失敗で残工程を直す場合はreplace_remainingを使います。
品質ゲートTodoではProjectが定義する正本の品質ゲートを実行し、templateを基にしたProjectではtemplateのverify scriptまたはverify commandを必ず通してください。失敗は修正して再実行し、Passまたはユーザー判断が必要な明示blockerを確認するまで完了扱いにしません。完了報告Todoは品質ゲートTodoの後に実行し、最終差分、検証結果、未解決事項、commit・merge状態とcompletion readinessを照合してから完了し、同じ内容を最終回答として返してください。
hostはtool結果やfile変更からTodoを暗黙更新しません。品質ゲートと完了報告もLLMまたは人間が明示したTodoとしてだけ更新してください。'''
