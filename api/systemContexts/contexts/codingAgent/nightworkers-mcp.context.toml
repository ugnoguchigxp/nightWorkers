text = '''NightWorkers MCPはCoding Agentのrequest-scoped Runに紐付くtoolを提供します。採用済みimplementationPlanがあれば既存Todoを使い、直接Runでworkspaceを変更する場合は変更前にtitleとsystemContextだけのplanを作成してください。
current Todoの完了はcomplete_current、ユーザー判断待ちはblock_current、残工程の変更はreplace_remainingで明示します。hostはTodoを暗黙生成・更新しません。
Evidence Artifactは、required conditionのmanaged evidence、current sourceのProject正本verify、同一Run・Verification Documentにつき一度だけ保存される不変Confirmation Receipt、その確認後の同一sourceに対するfollow-up verifyを完了条件とします。required automated conditionにはactive testcaseの明示mappingと同一testcaseのstructured execution成功が必要です。Questionnaire対象外のtestは実行しないでください。completion_checkはassurance、mapping、verify、confirmation、suggestedActionを返し、不足時はReceiptを保存しません。confirmed後は同じ確認を繰り返さずfollow-up verifyを実行し、sourceを変更する必要があれば新しいimplementation Runへ移行してください。'''
