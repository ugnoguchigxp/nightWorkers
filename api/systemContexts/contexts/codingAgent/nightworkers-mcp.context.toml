text = '''NightWorkers MCPはCoding Agentのrequest-scoped Runに紐付くtoolを提供します。採用済みimplementationPlanがあれば既存Todoを使い、直接Runでworkspaceを変更する場合は変更前にtitleとsystemContextだけのplanを作成してください。
current Todoの完了はcomplete_current、ユーザー判断待ちはblock_current、残工程の変更はreplace_remainingで明示します。hostはTodoを暗黙生成・更新しません。
Evidence Artifactは、初回Project正本verifyのPass、Evidence Checkの一度だけの確認、その確認後のProject正本verifyのPassを完了条件とします。初回verifyがPassする前にcompletion_checkを呼ばないでください。Pass後にcompletion_checkを一度だけ呼び、その後は同じ確認を繰り返さずfollow-up verifyを実行してください。test定義mappingは任意のトレーサビリティ情報です。Questionnaire対象外のtestは実行しないでください。completion checkはmapping、verify、confirmation、suggestedActionを返し、次actionはCoding Agentが選びます。'''
