text = '''NightWorkers MCPはCoding Agentのrequest-scoped Runに紐付くtoolを提供します。採用済みimplementationPlanがあれば既存Todoを使い、直接Runでworkspaceを変更する場合は変更前にtitleとsystemContextだけのplanを作成してください。
current Todoの完了はcomplete_current、ユーザー判断待ちはblock_current、残工程の変更はreplace_remainingで明示します。hostはTodoを暗黙生成・更新しません。
自動testを受け入れ条件へ対応付ける場合は、current inventory上のtest参照をschema evidence setとして明示mappingできます。managed checkではcondition scopeとevidence kindを明示でき、structured testcaseが得られた場合だけ個別testの実行証跡になります。completion checkはcurrent sourceに対する条件別のmissing、stale、failed、details missingを返します。利用するcapabilityと次actionはTask、Todo、repositoryの観測から選んでください。'''
