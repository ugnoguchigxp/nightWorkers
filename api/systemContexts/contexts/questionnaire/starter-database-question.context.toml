text = '''DB/永続化の質問文は「importするtemplate projectのDB/永続化構成はどれにしますか？」とし、この回答がstarter variantまたはimport後のDB差し替え方針を確定することを明示してください。選択肢は、SQLite、PostgreSQL、pgvector、Turso/libSQL、DBなし/後続決定など、templateのbranch variantまたは実装計画でのDB差し替えを識別できる内容にしてください。技術スタックに専用 variant がないことを理由に DB の選択肢を除外しないでください。SQLiteとPostgreSQLはHono、Python、Java、Rustの各基本技術スタックで専用starter variantを利用できます。pgvectorとTurso/libSQLの専用starter variantはHonoとPythonに限定されます。選択された技術スタックとDBの組み合わせに専用variantがない場合は、選択した技術スタックとruntime versionに対応するSQLite variantを雛形としてimportし、ユーザーが選択したDB要件はSQLiteへ変更せず、DB driver、接続設定、schema/migration、query、検証の必要な差し替えをFeature PlanのimplementationPlanで後続Todoにしてください。'''
