text = '''implementationPlanは実行順のsteps配列にし、各stepはtitleとsystemContextだけを持たせてください。titleは80文字以内の短い工程名、systemContextは600文字以内かつ通常1〜3文の具体的な局所指示です。key、id、covers、constraints、doneWhen、taskType、objective、nextAction、acceptanceCriteria、dependsOn、status、revisionは生成しないでください。
repositoryMaterializationIntentがstarter_templateまたはgit_importの場合、implementationPlanの先頭にはrepository materialization専用Todoを必ず1件置いてください。starter_templateでは、Questionnaireで確定した技術スタックとDB/永続化から選んだstackとvariantのtemplate projectを登録済みProject rootへimportする工程だとtitleで明示し、titleは「Hono/sqlite template projectをimportする」のように選択対象とimport操作を識別できる表現にしてください。曖昧な「構成を作成する」へ言い換えないでください。git_importでは、確定したrepo URLとrefからProjectをimportする工程だと明示してください。先頭TodoのsystemContextにはrepositoryMaterializationIntentを正本としてimportし、Git HEAD、Project root、期待するstarter構成またはimport元との一致を確認してから完了することを書いてください。機能実装、DB差し替え、migration、API、UIをこのTodoへ混在させず、後続Todoはmaterialization完了後に開始する順序にしてください。
repositoryMaterializationIntentがnullまたはexisting_gitの場合はmaterialization Todoを追加しないでください。repositoryMaterializationIntentと先頭Todoは同じQuestionnaire Decisionsから導出し、intentがあるのに先頭Todoがない、先頭Todoのstack・variant・import元がintentと異なる、またはimportを後続の機能実装Todoへ埋め込む計画を生成しないでください。
production変更の工程を先に並べ、その後にProject品質ゲートと完了報告をそれぞれ独立したTodo stepとして必ず1件ずつ置いてください。最後から2番目は品質ゲートTodo、最後は完了報告Todoとし、production実装、品質ゲート、完了報告を同じstepへまとめたり、順序を入れ替えたり、省略したりしないでください。
自動テストを採用した場合、production変更と同じ責務・粒度のfocused test（Unit / component / API / repositoryなど）は対応するproduction stepのsystemContextに含め、test作成だけのstepへ機械的に分離しないでください。複数工程を横断する検証、test基盤・fixtureの変更、既存test群の移行などが独立成果となる場合だけ別stepにできます。testを追加・更新するstepのsystemContextには、frameworkとProjectの構造上の制約を守り、人間可読なtest name/titleへ対応する`## 完了条件`（Verification Condition）と同じ日本語の振る舞い表現を使うことを短く書いてください。
品質ゲートTodoのsystemContextには、全production工程と必要な修正の後に実体Projectを観測し、Projectが定義する正本の品質ゲートを実行してPassさせることを書いてください。starter templateまたはその他のtemplateを基にmaterializeする場合は、そのtemplateが提供するverify scriptまたはverify commandを必ず実行対象に含めてください。失敗時は原因を修正して影響範囲を再検証し、Passまたはユーザー判断が必要な明示blockerを確認するまでTodoを完了扱いにしないでください。Questionnaireで選択されたtest種別は要件検証の範囲として維持し、選択外のtest種別を独立追加しないでください。ただしtemplate自身のverify commandの実行は省略しないでください。
完了報告TodoのsystemContextには、品質ゲートTodoの結果を確認した後で、最終差分、実行した検証と成否、未解決・回復済み・scope外の失敗、Todo・verification・Run・commit・merge状態を実観測と照合し、ユーザー向け完了報告を組み立てることを書いてください。未確認の変更や失敗を成功として報告せず、報告候補とcompletion readinessの矛盾を解消してからTodoを完了し、同じ内容を最終回答として返してください。'''
