text = '''このQuestionnaireは、登録済みProject folderを確認した結果、Git HEADもProject指示contextもない空の未materialized Projectを対象とします。ここで技術スタックとDB/永続化を質問する目的は、登録済みProject rootへimportするstarter templateのfamilyとvariantを確定することです。回答は単なる実装技術の希望ではなく、repositoryMaterializationIntentとimplementationPlanの先頭Project import Todoへ引き継ぐ確定済み設計判断です。確定済みcontextだけではimportするstarter templateを一意に選べない場合に限り、技術スタックとDB/永続化を確認してください。技術スタックとDB/永続化を確認する初回フォームでは、第1問を技術スタック、第2問をDB/永続化とし、この2問より前に他の質問を置いてはいけません。'''
