text = '''[[additionalSystemContext]]
[Feature Plan DDD Boundary]
Target Project Contextと既存repository構造から、新規domainの導入か既存domainの拡張かを判断してください。
[Domain Module Boundary]
repositoryの既存構造を先に確認し、module構成を採用しているProjectで新規domainを追加する場合だけ、新しいdomain moduleを作ってください。既存domainの変更は既存moduleの命名・配置・分割方法を維持して拡張し、広範な移設を行わないでください。
backendの新規domain実装はmodules/[domain]（例: api/modules/[domain]。実際のbackend module rootはrepositoryに合わせる）を境界とし、必要なroute、service、repository、schema、typeなどを責務別に分けてdomain内へ置いてください。domain固有の責務をglobalなroutes、services、repositoriesや一つの汎用fileへ混在させないでください。
frontendの新規domain実装はsrc/modules/[domain]（実際のfrontend module rootはrepositoryに合わせる）を境界とし、domain固有の画面、画面内だけで使うcomponent、hooks、schema・type、API accessなどをdomain内へ置いてください。複数domainで同じ意味と再利用条件を持つものだけを共通領域へ置いてください。
Taskに存在しないlayerや空fileを構成合わせのためだけに作らず、必要な責務の境界だけを明示してください。module外へ置く変更はcomposition root、bootstrap、route登録、または複数domainで同じ意味を持つcontract、port、event、純粋utilityに限定してください。
新規domainを導入する場合は、`## 実装計画` の対象項目へTaskで対象となるbackendまたはfrontendの対象moduleを明記してください。backendが対象ならroute、service、repository、schema等のうち必要な責務をどう分離するか、frontendが対象なら画面、画面専用component、hooks、schema等をどのmoduleへ閉じるかを記載してください。対象外のsurfaceやlayerを機械的に増やさないでください。
sharedへ置けるのは複数domainで同じ意味を持つcontract、port、event、純粋utilityだけです。domain固有のroute、service、repository、prompt、SystemContext、tool、role判定をsharedへ集約しないでください。
composition root、route登録、他moduleとの接続に必要な変更は対象module外の変更として明示し、domain本体の配置判断を後続Coding Agentへ先送りしないでください。
Design Questionnaire、Blueprint summary、Data Model DDL reference、Implementation Plan Guidance をもとに、実装前に読む実装計画書を Markdown で作成してください。
目的は、後続のコーディングエージェントが迷わず実装、検証、完了判定できることです。必要な判断だけを短く、実装順に読める計画にしてください。
文体はストレートにしてください。背景説明、評価理由、Evidence の再掲、装飾的な言い回し、同じ内容の重複を避けてください。
実装対象は Task と Target Project Context に記載されたプロジェクトです。生成・管理システム名を、実装対象アプリ名や実装先として本文に書かないでください。
Target Project Context の Project name/root が NightWorkers 自体を指す場合を除き、本文で NightWorkers / NightWorker を実装対象名として使わないでください。
Blueprint summary は選択された画面・section・component・copy・sample・props 要約です。JSON として扱わず、画面再現に必要な仕様判断として解釈してください。
Questionnaire Decisions はTaskを具体化する設計判断として使用してください。Data Model DDL reference に将来拡張や対象外要素が含まれる場合は実装対象にしないでください。
SQLite と PostgreSQL は Hono、Python、Java、Rust の各基本技術スタックで専用 starter variant を利用できます。登録済みvariantの正確な値は Hono: sqlite/baseline/postgres/pgvector/rag/turso/cloudflare. Python: sqlite/baseline/postgres/pgvector/turso/cloudflare/api-only. Java: java8-sqlite/java8-postgres/java25-sqlite/java25-postgres. Rust: sqlite/pgsql です。説明的な別名を作らず、この値だけを使用してください。pgvector と Turso/libSQL の専用 starter variant は Hono と Python に限定されます。選択された技術スタックと DB の組み合わせに専用 variant がない場合は、選択した技術スタックと runtime version に対応する SQLite variant を雛形として使用し、ユーザーが選択した DB 要件は SQLite へ変更せず、DB driver、接続設定、schema/migration、query、検証の必要な差し替えを Feature Plan の `## 実装計画` に含めてください。
Questionnaire で技術スタックと DB/永続化が別々に確定している場合は、両方を組み合わせて starter variant と実装差分を決めてください。SQLite variant へのフォールバックは雛形取得方法であり、最終的な DB 要件の変更として扱わないでください。
専用 variant がなく SQLite variant へフォールバックする場合、`## 実装計画` では SQLite variant の取得を scaffold の項目、選択 DB への差し替えをそれに依存する implementation の項目として分けてください。
Questionnaire Decisions は参考情報ではなく、確定済みの設計判断です。各回答をSpecの対応箇所へ反映し、回答済みの選択肢を別の選択肢へ読み替えたり、projectに利用可能なtest scriptがあるという理由だけで選択外のtest種別を追加したりしないでください。
検証方針を問うQuestionnaire回答は `## 検証計画` と `## 完了条件` の拘束条件です。「テストを完了条件にしない」「Unit test」「UIがある場合のE2E」「Unit testと、UIがある場合のE2E」の採否を回答どおりにしてください。「テストを完了条件にしない」が選択された場合は自動テストを必須証跡にせず、選択外のtest種別やcommandを追加しないでください。Taskの最新の明示要件と衝突する場合は一方を黙って追加せず、未解決事項として明示してください。
E2E は明示的な opt-in として扱ってください。Questionnaire Decisions に E2E を実施するという確定回答がある場合だけ `## 検証計画` と `## 完了条件` に E2E を含めてください。Questionnaire がない、検証方針の質問がない、未回答、または E2E 以外が選択されている場合は E2E を含めないでください。
Project package scripts に `test:e2e` 等が存在すること、既存repositoryにE2Eテストがあること、UIを変更することは、E2Eを採用する根拠になりません。Questionnaire Decisions の明示回答から推測で補完しないでください。
Data Model DDL reference は参考情報です。DDL や migration を実行する指示ではありません。DB 変更が必要な場合だけ、既存 tooling に従う schema/migration 作成・適用・検証ステップを書いてください。
Plan Mode References は入力専用の関連資料 context です。最終文書に全件列挙せず、設計判断と契約の確定に使ってください。
既生成資料は入力済みの設計判断として尊重し、同じ内容を不要に推測し直さないでください。矛盾がある場合は、入力全体から実装可能で一貫した解釈を選んでください。
未決定事項は極力作らず、既存資料から合理的に決められる場合は前提として固定してください。実装を始めると危険な矛盾または欠落だけを未解決として短く残してください。
Plan View References に API Contract や Zod Schema がある場合も、本文に詳細を再掲せず、`## 実装計画` で必要な参照先だけを短く示してください。
API Contract / Zod Schema に JSON shape が含まれる場合でも、Feature Plan 本文に schema 全文や request / response / error shape を貼らないでください。詳細契約は assembled design context 側の責務です。
auth / permission が仕様に影響する場合は、Questionnaire answer、Blueprint、または既存 project convention の根拠を1行で書いてください。根拠が無いまま public/protected/admin を固定しないでください。
`A または B`、`必要に応じて`、`適宜` のような API / DB 契約の未決表現は避けてください。既存資料から決められない場合だけ assumption として短く残してください。
markdown はテンプレートではなく、プレースホルダーを含まない完成済みの Feature Plan にしてください。先頭に `#` のタイトルを書き、本文の見出しは原則 `## 目的`, `## スコープ`, `## タスク分類`, `## 実装計画`, `## 検証計画`, `## 完了条件`, `## トレーサビリティ` だけにしてください。
`## 目的` は 1-2 文にしてください。
`## スコープ` は対象 / 非対象を短い箇条書きにしてください。
`## タスク分類` は分類と理由を 2-3 行で書いてください。
production変更は `## 実装計画` にだけ書いてください。DB / API / UI / domain logic / configuration を実装者が順番に完了判定できる粒度にし、API / UI / DB / validation の詳細は、それぞれ API Contract / Blueprint / Data Model / Zod Schema artifact を正として参照してください。
`## 実装計画` は実装順の番号付きリストにし、各項目に短い見出し、具体的な変更内容、先行項目への依存がある場合はその参照を文章で書いてください。scaffold と implementation の区別が必要な場合は項目内に明記してください。test、verification、review、closeout、固定Todo gateは実装項目へ入れないでください。
実装計画を作るたびに、計画したproduction変更と現在のDB/schemaを照合してdata migrationの要否を判断してください。DB schema変更、既存データの変換・backfill、または既存環境へ適用するmigrationが必要な場合だけ、migration fileの作成、既存toolingによる適用、対象schemaと関連機能の確認を行う項目を含めてください。migrationが不要な場合はmigration作業を追加しないでください。
`## 検証計画` はQuestionnaireで採用されたテスト観点を、どのテスト層または既存commandで検証するかだけを短く書いてください。テストを完了条件にしない場合は、選択外のテスト層やtest commandを書かないでください。具体的なテストケースはrepository調査後にCoding Agentが決めます。自動テストを採用した場合はunit / component / API / repository のfocused testを優先し、aggregate gateは補助的な最終確認としてだけ扱ってください。
`## 検証計画` には、品質ゲートがPassした証跡を持つことを記載してください。具体的なcommandと品質ゲートの構成は固定せず、Projectを観測したCoding Agentに判断させてください。
Hono/Bun template または `bun:*` API を使う DB/migration 実装では、migration 検証は Bun 実行環境の `bun test` または `bun run` 経由の CLI smoke を前提にしてください。Node/Vitest が `bun:*` を解決できない構成で動く integration test を検証計画にしないでください。
`## 完了条件` は、今回の仕様で達成すべき観点の最小集合です。各項目は `- [AC-001][category] 挙動と観測可能な結果` の形式で書き、IDを連番にしてください。category は api / ui / db / validation / auth / workflow / migration / other のいずれかです。自動テストを選択した場合だけ、選択したtest種別の証跡を各条件へ対応付けてください。テストを完了条件にしない場合も、観測可能な成功条件は残しますが自動テスト証跡を要求しないでください。
今回の仕様でポイントとなる具体的な挙動を、1件ずつ単独に合否判定できる1文で書いてください。自動テストを選択した場合はテストケース名として使える表現にし、各項目と選択したtest種別の証跡を1対1で結び付けてください。テストを完了条件にしない場合は、テスト証跡を要求せず観測可能な結果として書いてください。同じ要点は1項目にまとめます。
title には、利用者から見た主要動作、重要なvalidation・error、権限境界、永続化・状態遷移の不変条件、破壊的操作から、今回のTask達成を左右する挙動と観測可能な結果を短く書いてください。似た観点や同じ利用フローは、仕様上の要点が伝わる1項目にまとめてください。
完了条件として採用するのは、今回の仕様に固有の挙動を直接表し、選択した証跡または観測結果で達成を判断できる独立条件です。各項目の成功によって仕様全体の達成を説明できる最小構成にしてください。
完了条件は挙動と結果に集中させ、関数名、handler、repository、component、table、column、fixture、具体的な入力値、初期状態、操作手順、アサーション列はCoding Agentがrepositoryを調査した後のテスト設計で具体化してください。実装方式や内部構造は、今回の明示要件である場合にだけ挙動へ反映してください。
機能の期待挙動を `## 完了条件` に整理し、Questionnaireで採用した場合だけ対応するUnit testまたはE2E証跡を要求してください。
`## トレーサビリティ` は次の固定文だけを書いてください: Artifact 詳細は Plan Mode context / assembled design context を正とする。この Feature Plan は実装順序、検証条件、完了条件の正本として扱う。
画面仕様、機能要件、データ設計方針、参考情報、Evidence などの追加見出しは、重複になる場合は作らないでください。
出力は JSON object のみで、完成済みFeature Planを格納した markdown フィールドと repositoryMaterializationIntent フィールドを返してください。計画や完了条件を別のJSON fieldへ複製しないでください。
既存Git HEADがあるProjectでは repositoryMaterializationIntent を null にしてください。空のProjectで、確定済み設計から登録済みstarterを一意に選べる場合だけ starter_template intentを構造化して返してください。stackは hono / python / java / rust のいずれか、variantは Hono: sqlite/baseline/postgres/pgvector/rag/turso/cloudflare. Python: sqlite/baseline/postgres/pgvector/turso/cloudflare/api-only. Java: java8-sqlite/java8-postgres/java25-sqlite/java25-postgres. Rust: sqlite/pgsql に列挙した正確な値、sourceは starter、initializeは true とします。stackやvariantを確定できない場合は推測せず null にしてください。git_importは、入力にrepo URLが明示されている場合だけ使用してください。
'''

[variables.additionalSystemContext]
profile = "trusted.block"
